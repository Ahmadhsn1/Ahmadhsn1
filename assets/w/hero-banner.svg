<rect width="1200" height="260" fill="url(#bg)"/>
<ellipse class="glow" cx="600.0" cy="114.4" rx="520" ry="182.0" fill="url(#glow)"/>
<g class="drift"><line x1="120" y1="60" x2="250" y2="120" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6"/><line x1="250" y1="120" x2="170" y2="200" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6"/><line x1="1010" y1="70" x2="1090" y2="150" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6"/><line x1="1010" y1="70" x2="900" y2="40" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6"/><circle cx="120" cy="60" r="2.5" fill="#38BDF8" fill-opacity="0.5"/><circle cx="250" cy="120" r="2" fill="#38BDF8" fill-opacity="0.35"/><circle cx="170" cy="200" r="2" fill="#38BDF8" fill-opacity="0.3"/><circle cx="1010" cy="70" r="2.5" fill="#38BDF8" fill-opacity="0.5"/><circle cx="1090" cy="150" r="2" fill="#38BDF8" fill-opacity="0.35"/><circle cx="900" cy="40" r="2" fill="#38BDF8" fill-opacity="0.4"/><circle r="2.4" fill="#BFE8FF" fill-opacity="0.9"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" path="M1010,70 L1090,150"/></circle></g>
<text x="600.0" y="116" text-anchor="middle" font-size="66" font-weight="800" letter-spacing="9" fill="url(#wm)" filter="url(#soft)" opacity="0.5">AHMAD HASSAN</text>
<text x="600.0" y="116" text-anchor="middle" font-size="66" font-weight="800" letter-spacing="9" fill="url(#wm)">AHMAD HASSAN</text>
<g clip-path="url(#wmclip)"><rect class="sheen" x="-220" y="0" width="180" height="260" fill="url(#sheen)"/></g>
<rect class="caret" x="909" y="68" width="5" height="51" rx="1" fill="#38BDF8"/>
<text x="600.0" y="150" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="4" fill="#9DB2D2">AI SYSTEMS ENGINEER</text>
<text x="600.0" y="178" text-anchor="middle" font-family="'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#5C6F91">LLM products, end to end  ·  RAG  ·  agents  ·  multi-tenant data isolation</text>
<rect x="0" y="257" width="1200" height="3" fill="url(#bar)"/>
