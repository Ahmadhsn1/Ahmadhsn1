<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="AHMAD HASSAN - AI SYSTEMS ENGINEER">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="0.5" stop-color="#0B1220"/><stop offset="1" stop-color="#0A1428"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.42" r="0.55"><stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2563EB" stop-opacity="0.12"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
<linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DD3FC"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB" stop-opacity="0"/><stop offset="0.45" stop-color="#38BDF8"><animate attributeName="offset" values="0.30;0.62;0.30" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="clip"><rect width="1200" height="260" rx="16"/></clipPath>
<clipPath id="wmclip"><text x="600.0" y="116" text-anchor="middle" font-size="66" font-weight="800" letter-spacing="9">AHMAD HASSAN</text></clipPath>
<style>
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.85}}
@keyframes sweep{0%{transform:translateX(-460px)}62%,100%{transform:translateX(1420px)}}
@keyframes blink{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-4px)}}
.glow{animation:glow 7s ease-in-out infinite}
.sheen{animation:sweep 6s ease-in-out infinite}
.caret{animation:blink 1.05s step-end infinite}
.drift{animation:drift 16s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.glow,.sheen,.caret,.drift{animation:none}.caret{opacity:1}}
</style>
</defs>
